<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FF9A08" />

    <title>Синтезатор</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="stage">
      <!-- ШАПКА -->
      <header class="master-panel">
        <div class="section-heading">
          <h2>Синtезатор</h2>
          <p>Музыкальная лаборатория</p>
        </div>

        <button
          type="button"
          class="start-button"
          id="startButton"
          aria-pressed="false"
        >
          ВКЛЮЧИТЬ ЗВУК
        </button>

        <!-- Общая громкость -->
        <label class="master-volume-control">
          ОБЩАЯ ГРОМКОСТЬ

          <input
            type="range"
            id="global-volume"
            min="0"
            max="1"
            step="0.01"
            value="0.7"
          />
        </label>

        <!-- Статус аудиосистемы -->
        <div class="audio-status">
          <span class="status-dot" id="status-dot"></span>
          <span id="status-text">Система выключена</span>
        </div>
      </header>

      <!-- ИНСТРУМЕНТЫ -->
      <section
        class="instruments-grid"
        id="instruments-grid"
        aria-label="Музыкальные инструменты"
      >
        <!-- KICK -->
        <article class="instrument-card kick-card">
          <button
            type="button"
            class="square-object"
            data-id="kick"
            aria-label="Включить Kick"
            aria-pressed="false"
          >
            <span class="square-symbol">PIC</span>
          </button>

          <div class="instrument-controls">
            <label class="control">
              <span>ГРОМКОСТЬ <output>25%</output></span>
              <input
                type="range"
                data-control="volume"
                min="0"
                max="1"
                step="0.01"
                value="0.25"
              />
            </label>

            <label class="control">
              <span>ЧАСТОТА <output>0 st</output></span>
              <input
                type="range"
                data-control="frequency"
                min="-12"
                max="12"
                step="1"
                value="0"
              />
            </label>

            <label class="control">
              <span>СКОРОСТЬ <output>1.00×</output></span>
              <input
                type="range"
                data-control="speed"
                min="0.5"
                max="2"
                step="0.01"
                value="1"
              />
            </label>
          </div>
        </article>

        <!-- BASS -->
        <article class="instrument-card bass-card">
          <button
            type="button"
            class="square-object"
            data-id="bass"
            aria-label="Включить Bass"
            aria-pressed="false"
          >
            <span class="square-symbol">PIC</span>
          </button>

          <div class="instrument-controls">
            <label class="control">
              <span>ГРОМКОСТЬ <output>25%</output></span>
              <input
                type="range"
                data-control="volume"
                min="0"
                max="1"
                step="0.01"
                value="0.25"
              />
            </label>

            <label class="control">
              <span>ЧАСТОТА <output>0 st</output></span>
              <input
                type="range"
                data-control="frequency"
                min="-12"
                max="12"
                step="1"
                value="0"
              />
            </label>

            <label class="control">
              <span>СКОРОСТЬ <output>1.00×</output></span>
              <input
                type="range"
                data-control="speed"
                min="0.5"
                max="2"
                step="0.01"
                value="1"
              />
            </label>
          </div>
        </article>

        <!-- SYNTH -->
        <article class="instrument-card synth-card">
          <button
            type="button"
            class="square-object"
            data-id="synth"
            aria-label="Включить Synth"
            aria-pressed="false"
          >
            <span class="square-symbol">PIC</span>
          </button>

          <div class="instrument-controls">
            <label class="control">
              <span>ГРОМКОСТЬ <output>25%</output></span>
              <input
                type="range"
                data-control="volume"
                min="0"
                max="1"
                step="0.01"
                value="0.25"
              />
            </label>

            <label class="control">
              <span>ЧАСТОТА <output>0 st</output></span>
              <input
                type="range"
                data-control="frequency"
                min="-12"
                max="12"
                step="1"
                value="0"
              />
            </label>

            <label class="control">
              <span>СКОРОСТЬ <output>1.00×</output></span>
              <input
                type="range"
                data-control="speed"
                min="0.5"
                max="2"
                step="0.01"
                value="1"
              />
            </label>
          </div>
        </article>

        <!-- CLAP -->
        <article class="instrument-card clap-card">
          <button
            type="button"
            class="square-object"
            data-id="clap"
            aria-label="Включить Clap"
            aria-pressed="false"
          >
            <span class="square-symbol">PIC</span>
          </button>

          <div class="instrument-controls">
            <label class="control">
              <span>ГРОМКОСТЬ <output>25%</output></span>
              <input
                type="range"
                data-control="volume"
                min="0"
                max="1"
                step="0.01"
                value="0.25"
              />
            </label>

            <label class="control">
              <span>ЧАСТОТА <output>0 st</output></span>
              <input
                type="range"
                data-control="frequency"
                min="-12"
                max="12"
                step="1"
                value="0"
              />
            </label>

            <label class="control">
              <span>СКОРОСТЬ <output>1.00×</output></span>
              <input
                type="range"
                data-control="speed"
                min="0.5"
                max="2"
                step="0.01"
                value="1"
              />
            </label>
          </div>
        </article>

        <!-- HAT -->
        <article class="instrument-card hat-card">
          <button
            type="button"
            class="square-object"
            data-id="hat"
            aria-label="Включить Hat"
            aria-pressed="false"
          >
            <span class="square-symbol">PIC</span>
          </button>

          <div class="instrument-controls">
            <label class="control">
              <span>ГРОМКОСТЬ <output>25%</output></span>
              <input
                type="range"
                data-control="volume"
                min="0"
                max="1"
                step="0.01"
                value="0.25"
              />
            </label>

            <label class="control">
              <span>ЧАСТОТА <output>0 st</output></span>
              <input
                type="range"
                data-control="frequency"
                min="-12"
                max="12"
                step="1"
                value="0"
              />
            </label>

            <label class="control">
              <span>СКОРОСТЬ <output>1.00×</output></span>
              <input
                type="range"
                data-control="speed"
                min="0.5"
                max="2"
                step="0.01"
                value="1"
              />
            </label>
          </div>
        </article>

        <!-- PLUCK -->
        <article class="instrument-card pluck-card">
          <button
            type="button"
            class="square-object"
            data-id="pluck"
            aria-label="Включить Pluck"
            aria-pressed="false"
          >
            <span class="square-symbol">PIC</span>
          </button>

          <div class="instrument-controls">
            <label class="control">
              <span>ГРОМКОСТЬ <output>25%</output></span>
              <input
                type="range"
                data-control="volume"
                min="0"
                max="1"
                step="0.01"
                value="0.25"
              />
            </label>

            <label class="control">
              <span>ЧАСТОТА <output>0 st</output></span>
              <input
                type="range"
                data-control="frequency"
                min="-12"
                max="12"
                step="1"
                value="0"
              />
            </label>

            <label class="control">
              <span>СКОРОСТЬ <output>1.00×</output></span>
              <input
                type="range"
                data-control="speed"
                min="0.5"
                max="2"
                step="0.01"
                value="1"
              />
            </label>
          </div>
        </article>
      </section>

      <!-- ПОДВАЛ -->
      <footer class="footer">
        <span>СИНТЕЗАТОР</span>
        <span>МУЗЫКАЛЬНАЯ ЛАБОРАТОРИЯ</span>
      </footer>
    </main>

    <!-- Сначала аудиодвижок -->
    <script src="scripts/synth.js"></script>

    <!-- Затем управление интерфейсом -->
    <script src="scripts/script.js"></script>
  </body>
</html>
